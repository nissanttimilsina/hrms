# HRMS platform: production stack for a single VPS.
#   cp .env.example .env && chmod 600 .env   # then fill in every CHANGE_ME
#   docker compose up -d --build
# Services: postgres, redis, migrate (one-shot: migrations + reference seed), api (x2), worker, web (Nginx + the three web apps, TLS).
# Only the web service publishes ports. Postgres and Redis are reachable on the internal network only.
name: hrms

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL_OWNER: postgresql://hrms_owner:${HRMS_OWNER_PASSWORD}@postgres:5432/hrms
  DATABASE_URL_APP: postgresql://hrms_app:${HRMS_APP_PASSWORD}@postgres:5432/hrms
  DATABASE_URL_SYSTEM: postgresql://hrms_system:${HRMS_SYSTEM_PASSWORD}@postgres:5432/hrms
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  TRUST_PROXY: "1"
  COOKIE_SECURE: "true"
  STORAGE_DIR: /app/storage

x-api: &api
  build: { context: ../../backend }
  image: hrms-api:${IMAGE_TAG:-latest}
  env_file: [.env]
  environment: *api-env
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HRMS_DB: hrms
      HRMS_OWNER_PASSWORD: ${HRMS_OWNER_PASSWORD}
      HRMS_APP_PASSWORD: ${HRMS_APP_PASSWORD}
      HRMS_SYSTEM_PASSWORD: ${HRMS_SYSTEM_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200", "-c", "log_min_duration_statement=1000"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrms"]
      interval: 5s
      retries: 20
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 20

  migrate:
    <<: *api
    command: ["sh", "-c", "node src/database/migrate.js && node src/database/seeds/run.js"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    <<: *api
    volumes: [uploads:/app/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy: { replicas: 2 }

  worker:
    <<: *api
    command: ["node", "src/jobs/worker.js"]
    volumes: [uploads:/app/storage]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ../../frontend
      args:
        ROOT_DOMAIN: ${ROOT_DOMAIN}
        BRAND_NAME: ${BRAND_NAME:-Lishnu HRMS}
        CONTACT_EMAIL: ${CONTACT_EMAIL:-}
        CONTACT_PHONE: ${CONTACT_PHONE:-}
    image: hrms-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: { ROOT_DOMAIN: "${ROOT_DOMAIN}" }
    ports: ["80:80", "443:443"]
    volumes:
      - ${CERTS_DIR:-/etc/hrms/certs}:/etc/nginx/certs:ro
      - acme:/var/www/acme
    depends_on: [api]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

volumes:
  pgdata:
  redisdata:
  uploads:
  acme:
