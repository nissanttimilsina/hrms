# HRMS platform — full stack.
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
# Services: postgres, redis, migrate (one-shot), api, worker, nginx (TLS).
name: hrms

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL_OWNER: postgresql://hrms_owner:${HRMS_OWNER_PASSWORD}@postgres:5432/hrms
  DATABASE_URL_APP: postgresql://hrms_app:${HRMS_APP_PASSWORD}@postgres:5432/hrms
  DATABASE_URL_SYSTEM: postgresql://hrms_system:${HRMS_SYSTEM_PASSWORD}@postgres:5432/hrms
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  ROOT_DOMAIN: ${ROOT_DOMAIN:-yourhrms.com}
  APP_HOST: app.${ROOT_DOMAIN:-yourhrms.com}
  ADMIN_HOST: admin.${ROOT_DOMAIN:-yourhrms.com}
  MARKETING_HOST: www.${ROOT_DOMAIN:-yourhrms.com}
  CORS_ORIGINS: https://www.${ROOT_DOMAIN:-yourhrms.com},https://admin.${ROOT_DOMAIN:-yourhrms.com},https://app.${ROOT_DOMAIN:-yourhrms.com}
  TRUST_PROXY: "1"
  COOKIE_SECURE: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HRMS_DB: hrms
      HRMS_OWNER_PASSWORD: ${HRMS_OWNER_PASSWORD}
      HRMS_APP_PASSWORD: ${HRMS_APP_PASSWORD}
      HRMS_SYSTEM_PASSWORD: ${HRMS_SYSTEM_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrms"]
      interval: 5s
      retries: 20
    # Not published: only reachable on the internal network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ../../backend }
    environment: *api-env
    command: ["sh", "-c", "node src/database/migrate.js && node src/database/seeds/run.js"]
    env_file: [{ path: .env, required: false }]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ../../backend }
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy: { replicas: 2 }

  worker:
    build: { context: ../../backend }
    restart: unless-stopped
    environment: *api-env
    command: ["node", "src/jobs/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ../nginx/hrms.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
