# Nginx reverse proxy for the HRMS platform.
# Certificates: a wildcard cert for *.yourhrms.com + yourhrms.com in ./certs
# (fullchain.pem / privkey.pem). Custom tenant domains get their own server
# block (or an on-demand TLS proxy such as Caddy) once verified.

upstream hrms_api {
  server api:4000;
  keepalive 32;
}

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
  listen 80 default_server;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl default_server;
  http2 on;
  # www (marketing), admin (Super Admin), app (generic company app), <tenant> subdomains
  server_name yourhrms.com *.yourhrms.com;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 25m;   # document uploads; API itself caps JSON at 1 MB
  server_tokens off;

  # Health checks are internal only
  location /health/ { allow 10.0.0.0/8; allow 172.16.0.0/12; allow 127.0.0.1; deny all; proxy_pass http://hrms_api; }

  location ~ ^/api/v1/(auth|admin/auth)/(login|password/forgot) {
    limit_req zone=auth burst=5 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://hrms_api;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;                         # tenant resolution depends on this
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
    proxy_pass http://hrms_api;
  }

  # Frontend SPAs (built static assets) are added in Phase 2:
  #   www.*   -> /srv/marketing     admin.* -> /srv/super-admin     others -> /srv/company-app
  location / { return 404; }
}
