name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL_OWNER: postgresql://hrms_owner:owner_pw@localhost:5432/hrms_test
      DATABASE_URL_APP: postgresql://hrms_app:app_pw@localhost:5432/hrms_test
      DATABASE_URL_SYSTEM: postgresql://hrms_system:system_pw@localhost:5432/hrms_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Create database roles
        run: HRMS_DB=hrms_test HRMS_OWNER_PASSWORD=owner_pw HRMS_APP_PASSWORD=app_pw HRMS_SYSTEM_PASSWORD=system_pw ./infrastructure/docker/postgres/00-roles.sh
      - run: npm ci
        working-directory: backend
      - name: Migrations (twice; must be idempotent)
        working-directory: backend
        run: node src/database/migrate.js && node src/database/migrate.js
      - name: Tests (unit, integration, API, tenant isolation, RBAC, subscriptions, billing, HR, payroll)
        working-directory: backend
        run: npm test
      - name: PostgreSQL 16 client tools (match the server; newer pg_dump writes SET transaction_timeout)
        run: |
          sudo apt-get install -y -qq postgresql-client-16 || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16; }
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Backup & restore drill
        run: |
          BACKUP_DATABASE_URL=$DATABASE_URL_OWNER BACKUP_DIR=/tmp/bk ./infrastructure/deployment/backup.sh
          ADMIN_URL=postgresql://postgres:postgres@localhost:5432/postgres ./infrastructure/deployment/restore-verify.sh $(ls /tmp/bk/*.dump)
      - name: Dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build marketing site (prerendered), Super Admin portal and company app
        working-directory: frontend
        run: npm run build
        env:
          VITE_ROOT_DOMAIN: example.com
          VITE_SITE_URL: https://www.example.com
      - name: Prerender sanity check
        run: |
          test -f frontend/marketing/dist/_shell.html
          grep -q "<title>Pricing" frontend/marketing/dist/pricing/index.html
          grep -q "https://www.example.com/features" frontend/marketing/dist/sitemap.xml
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t on the rendered production template
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=example.com" -keyout certs/privkey.pem -out certs/fullchain.pem
          docker run --rm --add-host api:127.0.0.1 -e ROOT_DOMAIN=example.com -e MARKETING_HOST=www.example.com -e MARKETING_REDIRECT_HOST=example.com -e REAL_IP_FROM=127.0.0.1/32 \
            -v "$PWD/frontend/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/frontend/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$PWD/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine sh -c 'rm /etc/nginx/conf.d/default.conf && /docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'
      - name: Shell scripts parse
        run: for f in infrastructure/vps/*.sh infrastructure/deployment/*.sh; do bash -n "$f"; done

  images:
    needs: [backend, frontend, nginx-config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API / worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: hrms-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image (Nginx + marketing, admin, company app)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: hrms-web:${{ github.sha }}
          build-args: ROOT_DOMAIN=example.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
