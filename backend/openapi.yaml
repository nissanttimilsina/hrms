openapi: 3.1.0
info:
  title: HRMS Platform API
  version: 1.0.0-phase1
  description: |
    Lishnu Tech multi-tenant HRMS — Phase 1 foundation API.

    **Hosts & tenancy.** Company workspace endpoints are called on the tenant host
    (`<slug>.yourhrms.com`) or the generic app host (`app.yourhrms.com`). The tenant is
    resolved from the verified Host mapping and/or the signed access token — never from a
    client-supplied id. Super Admin endpoints (`/admin/*`) use platform tokens.

    **Envelope.** Success: `{ success: true, data, meta? }`. Error:
    `{ success: false, error: { code, message, details?, requestId } }`.

    **Stable error codes** clients should handle: `UNAUTHORIZED`, `TOKEN_EXPIRED`, `SESSION_REVOKED`,
    `TENANT_MISMATCH`, `FORBIDDEN`, `OUT_OF_SCOPE`, `ESCALATION_DENIED`, `FEATURE_NOT_IN_PLAN` (show upgrade),
    `LIMIT_REACHED` (show upgrade), `SUBSCRIPTION_INACTIVE` (402, read-only — show renew),
    `TENANT_BLOCKED`, `VALIDATION_ERROR`, `DUPLICATE`, `RATE_LIMITED`.

    Every tenant response carries `X-Subscription-State: FULL|GRACE|READ_ONLY`.
servers:
  - url: /api/v1
components:
  securitySchemes:
    tenantBearer: { type: http, scheme: bearer, bearerFormat: JWT, description: 'aud=tenant' }
    platformBearer: { type: http, scheme: bearer, bearerFormat: JWT, description: 'aud=platform' }
  parameters:
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    pageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    order: { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
    search: { name: search, in: query, schema: { type: string, maxLength: 100 } }
    id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    Error:
      type: object
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
            requestId: { type: string }
    PageMeta:
      type: object
      properties: { page: { type: integer }, pageSize: { type: integer }, total: { type: integer }, totalPages: { type: integer } }
    Tokens:
      type: object
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: seconds }
        refreshToken: { type: string, description: 'Only when X-Client: mobile. Browsers get an httpOnly cookie.' }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        workspace: { type: string, description: 'Tenant slug; required only on the generic app host' }
    DataScope: { type: string, enum: [OWN, DIRECT_REPORTS, DEPARTMENT, BRANCH, SELECTED_BRANCHES, COMPANY] }
    Grant:
      type: object
      required: [permission]
      properties:
        permission: { type: string, example: 'employees:view' }
        scope: { $ref: '#/components/schemas/DataScope' }
        branchIds: { type: array, items: { type: string, format: uuid } }
    Branch:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        address: { type: [string, 'null'] }
        isHeadOffice: { type: boolean }
        isActive: { type: boolean }
    BranchInput:
      type: object
      required: [code, name]
      properties: { code: { type: string }, name: { type: string }, address: { type: string }, isHeadOffice: { type: boolean }, isActive: { type: boolean } }
    DepartmentInput:
      type: object
      required: [code, name]
      properties: { code: { type: string }, name: { type: string }, branchId: { type: string, format: uuid }, parentId: { type: string, format: uuid } }
    Employee:
      type: object
      properties:
        id: { type: string, format: uuid }
        employeeCode: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        workEmail: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        branchId: { type: [string, 'null'], format: uuid }
        departmentId: { type: [string, 'null'], format: uuid }
        managerId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [ACTIVE, PROBATION, ON_NOTICE, SUSPENDED, TERMINATED] }
        joinedOn: { type: string, format: date }
    EmployeeInput:
      type: object
      required: [firstName, lastName, joinedOn]
      properties:
        employeeCode: { type: string, description: 'Omit to auto-generate from the tenant ID format' }
        firstName: { type: string }
        lastName: { type: string }
        workEmail: { type: string, format: email }
        phone: { type: string }
        branchId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid }
        managerId: { type: string, format: uuid }
        status: { type: string }
        joinedOn: { type: string, format: date }
    PublicPlan:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        contactSales: { type: boolean }
        trialDays: { type: integer }
        currency: { type: string }
        prices: { type: object, properties: { monthly: { type: [number, 'null'] }, annual: { type: [number, 'null'] } } }
        annualSavings: { type: [object, 'null'], properties: { amount: { type: number }, percent: { type: integer } } }
        limits: { type: object, properties: { employees: { type: [integer, 'null'] }, branches: { type: [integer, 'null'] }, storageMb: { type: [integer, 'null'] } } }
        highlights: { type: array, items: { type: string } }
        features: { type: array, items: { type: object, properties: { key: { type: string }, name: { type: string }, category: { type: string } } } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    OK: { description: OK }

paths:
  /public/plans:
    get:
      tags: [Public]
      summary: Pricing catalogue for the marketing site (DB-driven)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PublicPlan' } } } } } } }

  # ------------------------------------------------------------------ tenant auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in to a company workspace
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '200': { description: 'Signed in; sets hrms_rt cookie', content: { application/json: { schema: { $ref: '#/components/schemas/Tokens' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: 'Rotate refresh token (requires X-Requested-With, or X-Client: mobile)'
      description: Reusing a rotated token revokes the whole session family (TOKEN_REUSED).
      responses: { '200': { $ref: '#/components/responses/OK' }, '401': { $ref: '#/components/responses/Error' } }
  /auth/logout:
    post: { tags: [Auth], security: [{ tenantBearer: [] }], summary: Revoke current session, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /auth/logout-all:
    post: { tags: [Auth], security: [{ tenantBearer: [] }], summary: Revoke all sessions of the user, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /auth/me:
    get: { tags: [Auth], security: [{ tenantBearer: [] }], summary: 'Current user, tenant, permissions (with scopes), plan, features, limits, usage', responses: { '200': { $ref: '#/components/responses/OK' } } }
  /auth/sessions:
    get: { tags: [Auth], security: [{ tenantBearer: [] }], summary: List active sessions, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /auth/sessions/{familyId}:
    delete:
      tags: [Auth]
      security: [{ tenantBearer: [] }]
      parameters: [{ name: familyId, in: path, required: true, schema: { type: string, format: uuid } }]
      summary: Revoke one of my sessions
      responses: { '200': { $ref: '#/components/responses/OK' } }
  /auth/password/forgot:
    post: { tags: [Auth], summary: Request reset email (always 200), responses: { '200': { $ref: '#/components/responses/OK' } } }
  /auth/password/reset:
    post: { tags: [Auth], summary: Reset password with token (revokes all sessions), responses: { '200': { $ref: '#/components/responses/OK' }, '400': { $ref: '#/components/responses/Error' } } }
  /auth/password/change:
    post: { tags: [Auth], security: [{ tenantBearer: [] }], summary: Change password (revokes all sessions), responses: { '200': { $ref: '#/components/responses/OK' } } }
  /auth/invitations/accept:
    post: { tags: [Auth], summary: 'Accept a workspace invitation and set a password', responses: { '200': { $ref: '#/components/responses/OK' } } }

  # ------------------------------------------------------------------ organization
  /branches:
    get:
      tags: [Organization]
      security: [{ tenantBearer: [] }]
      summary: List branches (branches:view)
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { $ref: '#/components/parameters/search' }, { $ref: '#/components/parameters/order' }, { name: sort, in: query, schema: { type: string, enum: [name, code, createdAt] } }, { name: includeInactive, in: query, schema: { type: boolean } }]
      responses: { '200': { $ref: '#/components/responses/OK' } }
    post:
      tags: [Organization]
      security: [{ tenantBearer: [] }]
      summary: Create branch (branches:create; enforces branch limit)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BranchInput' } } } }
      responses: { '201': { $ref: '#/components/responses/OK' }, '403': { $ref: '#/components/responses/Error' } }
  /branches/{id}:
    patch: { tags: [Organization], security: [{ tenantBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Update branch (branches:edit), responses: { '200': { $ref: '#/components/responses/OK' } } }
    delete: { tags: [Organization], security: [{ tenantBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Soft-delete branch (branches:delete), responses: { '200': { $ref: '#/components/responses/OK' }, '409': { $ref: '#/components/responses/Error' } } }
  /departments:
    get: { tags: [Organization], security: [{ tenantBearer: [] }], summary: List departments (departments:view), responses: { '200': { $ref: '#/components/responses/OK' } } }
    post:
      tags: [Organization]
      security: [{ tenantBearer: [] }]
      summary: Create department (departments:create)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DepartmentInput' } } } }
      responses: { '201': { $ref: '#/components/responses/OK' } }
  /departments/{id}:
    patch: { tags: [Organization], security: [{ tenantBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Update department, responses: { '200': { $ref: '#/components/responses/OK' } } }
    delete: { tags: [Organization], security: [{ tenantBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Soft-delete department, responses: { '200': { $ref: '#/components/responses/OK' } } }

  # ------------------------------------------------------------------ employees
  /employees:
    get:
      tags: [Employees]
      security: [{ tenantBearer: [] }]
      summary: List employees within the caller's data scope (employees:view)
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { $ref: '#/components/parameters/search' }, { $ref: '#/components/parameters/order' }, { name: sort, in: query, schema: { type: string, enum: [createdAt, lastName, firstName, employeeCode, joinedOn] } }, { name: status, in: query, schema: { type: string } }, { name: branchId, in: query, schema: { type: string, format: uuid } }, { name: departmentId, in: query, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/OK' } }
    post:
      tags: [Employees]
      security: [{ tenantBearer: [] }]
      summary: Create employee (employees:create; enforces employee limit and scope)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Employee' } } } }, '403': { $ref: '#/components/responses/Error' } }
  /employees/{id}:
    get: { tags: [Employees], security: [{ tenantBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Get employee (404 when out of scope), responses: { '200': { $ref: '#/components/responses/OK' }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { tags: [Employees], security: [{ tenantBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Update employee (employees:edit), responses: { '200': { $ref: '#/components/responses/OK' } } }

  # ------------------------------------------------------------------ access control
  /permissions:
    get: { tags: [Access], security: [{ tenantBearer: [] }], summary: Permission catalogue with availableInPlan flag (roles:view), responses: { '200': { $ref: '#/components/responses/OK' } } }
  /roles:
    get: { tags: [Access], security: [{ tenantBearer: [] }], summary: Roles with grants (roles:view), responses: { '200': { $ref: '#/components/responses/OK' } } }
    post:
      tags: [Access]
      security: [{ tenantBearer: [] }]
      summary: Create custom role (roles:create; cannot grant what you do not hold)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, description: { type: string }, grants: { type: array, items: { $ref: '#/components/schemas/Grant' } } } } } }
      responses: { '201': { $ref: '#/components/responses/OK' }, '403': { $ref: '#/components/responses/Error' } }
  /roles/{id}/permissions:
    put:
      tags: [Access]
      security: [{ tenantBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      summary: Replace role grants (roles:edit)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { grants: { type: array, items: { $ref: '#/components/schemas/Grant' } } } } } } }
      responses: { '200': { $ref: '#/components/responses/OK' } }
  /roles/{id}:
    delete: { tags: [Access], security: [{ tenantBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Delete custom role (roles:delete), responses: { '200': { $ref: '#/components/responses/OK' } } }
  /users:
    get: { tags: [Access], security: [{ tenantBearer: [] }], summary: List workspace users (users:view), responses: { '200': { $ref: '#/components/responses/OK' } } }
  /users/invitations:
    post: { tags: [Access], security: [{ tenantBearer: [] }], summary: Invite a user (users:create; enforces user limit), responses: { '201': { $ref: '#/components/responses/OK' } } }
  /users/{id}/roles:
    put: { tags: [Access], security: [{ tenantBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Set user roles (users:manage; protects last owner), responses: { '200': { $ref: '#/components/responses/OK' } } }
  /audit-logs:
    get: { tags: [Access], security: [{ tenantBearer: [] }], summary: Tenant audit log (audit:view), responses: { '200': { $ref: '#/components/responses/OK' } } }
  /subscription:
    get: { tags: [Subscription], security: [{ tenantBearer: [] }], summary: 'My plan, access state, features, limits and usage (subscription:view)', responses: { '200': { $ref: '#/components/responses/OK' } } }

  # ------------------------------------------------------------------ Super Admin
  /admin/auth/login:
    post:
      tags: [Admin Auth]
      summary: Platform staff sign-in
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses: { '200': { $ref: '#/components/responses/OK' }, '401': { $ref: '#/components/responses/Error' } }
  /admin/auth/refresh:
    post: { tags: [Admin Auth], summary: Rotate platform refresh token, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /admin/auth/logout:
    post: { tags: [Admin Auth], security: [{ platformBearer: [] }], summary: Sign out, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /admin/auth/me:
    get: { tags: [Admin Auth], security: [{ platformBearer: [] }], summary: Platform user, roles and permissions, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /admin/tenants:
    get: { tags: [Admin Tenants], security: [{ platformBearer: [] }], summary: List tenants (tenants:view), responses: { '200': { $ref: '#/components/responses/OK' } } }
    post: { tags: [Admin Tenants], security: [{ platformBearer: [] }], summary: Provision a tenant (tenants:manage), responses: { '201': { $ref: '#/components/responses/OK' } } }
  /admin/tenants/{id}:
    get: { tags: [Admin Tenants], security: [{ platformBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Tenant detail with subscription, usage, history, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /admin/tenants/{id}/suspend:
    post: { tags: [Admin Tenants], security: [{ platformBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Suspend tenant and revoke sessions, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /admin/tenants/{id}/activate:
    post: { tags: [Admin Tenants], security: [{ platformBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Re-activate tenant, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /admin/tenants/{id}/subscription/plan:
    patch: { tags: [Admin Subscriptions], security: [{ platformBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Change plan (subscriptions:manage), responses: { '200': { $ref: '#/components/responses/OK' } } }
  /admin/tenants/{id}/subscription/limits:
    patch: { tags: [Admin Subscriptions], security: [{ platformBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Override employee/branch limits, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /admin/tenants/{id}/subscription/modules:
    post: { tags: [Admin Subscriptions], security: [{ platformBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Enable an add-on module, responses: { '201': { $ref: '#/components/responses/OK' } } }
  /admin/tenants/{id}/subscription/activate:
    post: { tags: [Admin Subscriptions], security: [{ platformBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Verify manual payment and start a new period (billing:manage), responses: { '200': { $ref: '#/components/responses/OK' } } }
  /admin/features:
    get: { tags: [Admin Plans], security: [{ platformBearer: [] }], summary: Feature catalogue, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /admin/plans:
    get: { tags: [Admin Plans], security: [{ platformBearer: [] }], summary: Plans with price history and entitlements, responses: { '200': { $ref: '#/components/responses/OK' } } }
    post: { tags: [Admin Plans], security: [{ platformBearer: [] }], summary: Create plan (plans:manage), responses: { '201': { $ref: '#/components/responses/OK' } } }
  /admin/plans/{id}:
    patch: { tags: [Admin Plans], security: [{ platformBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Update plan limits/metadata, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /admin/plans/{id}/prices:
    put: { tags: [Admin Plans], security: [{ platformBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Set a new versioned price, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /admin/plans/{id}/entitlements:
    put: { tags: [Admin Plans], security: [{ platformBearer: [] }], parameters: [{ $ref: '#/components/parameters/id' }], summary: Replace plan feature list, responses: { '200': { $ref: '#/components/responses/OK' } } }
  /admin/audit-logs:
    get: { tags: [Admin Audit], security: [{ platformBearer: [] }], summary: Platform-wide audit log (audit:view), responses: { '200': { $ref: '#/components/responses/OK' } } }
