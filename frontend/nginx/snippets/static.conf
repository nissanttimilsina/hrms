# Hashed build assets never change: cache for a year. HTML is always revalidated.
location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/security.conf; try_files $uri =404; }
location = /sw.js { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security.conf; try_files $uri =404; }
