# Reverse proxy to the API. The Host header is forwarded unchanged: tenant resolution depends on it.
location ~ ^/api/v1/(auth|admin/auth)/(login|password/forgot|mfa) {
  limit_req zone=auth burst=5 nodelay;
  limit_req_status 429;
  include /etc/nginx/snippets/proxy.conf;
}
location ~ ^/api/v1/public/(leads|signup|newsletter) {
  limit_req zone=forms burst=5 nodelay;
  limit_req_status 429;
  include /etc/nginx/snippets/proxy.conf;
}
# Biometric terminals (ADMS push protocol). Devices are identified by serial number in the API.
location /iclock/ {
  include /etc/nginx/snippets/proxy.conf;
}
location /api/ {
  include /etc/nginx/snippets/proxy.conf;
}
location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
